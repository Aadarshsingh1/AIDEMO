<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  
  <!-- Connection Network Lines -->
  <line x1="20" y1="20" x2="44" y2="44" stroke="#334155" stroke-width="2"/>
  <line x1="44" y1="20" x2="20" y2="44" stroke="#334155" stroke-width="2"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- LinkedIn Node (Top-Left) -->
  <circle cx="20" cy="20" r="10" fill="#0A66C2"/>
  <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">in</text>

  <!-- Reddit Node (Top-Right) -->
  <circle cx="44" cy="20" r="10" fill="#FF4500"/>
  <circle cx="44" cy="19" r="4.5" fill="#ffffff"/>
  <circle cx="42" cy="18.5" r="1" fill="#FF4500"/>
  <circle cx="46" cy="18.5" r="1" fill="#FF4500"/>

  <!-- Facebook Node (Bottom-Left) -->
  <circle cx="20" cy="44" r="10" fill="#1877F2"/>
  <text x="20" y="48.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">f</text>

  <!-- Instagram Node (Bottom-Right) -->
  <circle cx="44" cy="44" r="10" fill="#E1306C"/>
  <rect x="39.5" y="39.5" width="9" height="9" rx="2.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="44" cy="44" r="2.2" fill="none" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Center Hub / Research Magnifier Badge -->
  <circle cx="32" cy="32" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M30 30 L34 34 M33 30 A 2 2 0 1 0 29 30 A 2 2 0 1 0 33 30" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
